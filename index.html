<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jersey Stock Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 4l6-2 6 2v6c0 5-3.5 9-6 10-2.5-1-6-5-6-10V4z"></path>
      </svg>
      <span>Jersey Stock</span>
    </div>

    <nav>
      <a href="#">Dashboard</a>
      <a href="#">Stock</a>
      <a href="#">Clientes</a>
      <a href="#">Envios</a>
      <a href="#">Relatórios</a>
    </nav>
  </aside>

  <main class="main-content">

    <header>
      <h1>Gestão de Stock</h1>
    </header>

    <section class="cards">
      <div class="card">
        <h3>Total Stock</h3>
        <p id="totalStock">0</p>
      </div>

      <div class="card">
        <h3>Lucro Total</h3>
        <p id="lucroTotal">0€</p>
      </div>

      <div class="card">
        <h3>Produtos Vendidos</h3>
        <p id="vendidos">0</p>
      </div>
    </section>

    <section class="form-section">
      <h2>Adicionar Produto</h2>

      <div class="form-grid">
        <input type="text" id="liga" placeholder="Liga">
        <input type="text" id="clube" placeholder="Clube">
        <input type="text" id="epoca" placeholder="Época">

        <select id="tipo">
          <option>Fan Version</option>
          <option>Player Version</option>
        </select>

        <select id="tamanho">
          <option>S</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
        </select>

        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="preco" placeholder="Preço Camisola">
        <input type="number" id="frete" placeholder="Frete">
        <input type="number" id="venda" placeholder="Preço Venda">

        <input type="text" id="cliente" placeholder="Nome Cliente">
        <input type="text" id="telefone" placeholder="Telefone">
        <input type="text" id="morada" placeholder="Morada">
        <input type="text" id="cep" placeholder="Código Postal / CEP">
        <input type="text" id="pais" placeholder="País">
        <input type="text" id="localidade" placeholder="Localidade">
        <input type="text" id="rastreio" placeholder="Código Rastreio">
      </div>

      <button onclick="adicionarProduto()">Adicionar Produto</button>
    </section>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>Clube</th>
            <th>Tamanho</th>
            <th>Qtd</th>
            <th>Custo</th>
            <th>Venda</th>
            <th>Lucro</th>
            <th>Cliente</th>
            <th>Rastreio</th>
          </tr>
        </thead>

        <tbody id="tabelaProdutos"></tbody>
      </table>
    </section>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
```
